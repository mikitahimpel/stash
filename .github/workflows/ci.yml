name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint format:check typecheck test
      - run: pnpm --filter @stash/extension build

  # The layout audit (docs/design.md, "Layout audit"): the built web app in headless Chromium,
  # every page against the control and spacing tokens. One browser, one page at a time.
  layout-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stash/web exec playwright install --with-deps chromium
      - run: pnpm --filter @stash/web audit:layout
      # The Connect guides end to end on the same build and fixtures, one page at a time.
      - run: pnpm --filter @stash/web walk:connect
      # The header tabs on the same build: a switch to a visited tab paints within 100 ms from
      # cached data, without a skeleton, and keeps the tab's scroll position.
      - run: pnpm --filter @stash/web check:tab-switch
      # The loading states on the same build, with a slow api: every skeleton has the box of what
      # replaces it, and no page shifts (CLS at most 0.01).
      - run: pnpm --filter @stash/web check:loading
      # Live updates on the same build, with the event stream played by the check: a pending row
      # turns into its summary, and a link saved on another device appears on top, with no reload,
      # no request and no shift (CLS at most 0.01).
      - run: pnpm --filter @stash/web check:live-updates
