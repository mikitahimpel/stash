packages:
  - apps/*
  - packages/*/*

allowBuilds:
  workerd: true

catalog:
  effect: 4.0.6
  "@effect/ai-anthropic": 4.0.6
  "@effect/atom-vue": 4.0.6
  "@effect/platform-browser": 4.0.6
  "@effect/platform-node": 4.0.6
  "@effect/vitest": 4.0.6
  # Alchemy v2 is beta: pin exact, bump alchemy and @alchemy.run/* together (see docs/alchemy.md).
  alchemy: 2.0.0-beta.84
  "@alchemy.run/cloudflare": 2.0.0-beta.84
  "@cloudflare/workers-types": 5.20261023.1
  "@types/firefox-webext-browser": 143.0.1
  "@types/node": 24.19.2
  fake-indexeddb: 6.2.5
  oxfmt: 0.74.0
  oxlint: 1.89.0
  oxlint-plugin-vue-sfc: 0.2.1
  turbo: 2.11.10
  typescript: 7.0.2
  vitest: 5.0.5
  vue: 3.5.44
  vue-tsc: 3.3.13

catalogs:
  # vue-tsc needs TypeScript's JS API, which TypeScript 7 (native) no longer ships.
  # Vue packages use `"typescript": "catalog:vue"`; see packages/config/oxlint/README.md.
  vue:
    typescript: 6.0.3
